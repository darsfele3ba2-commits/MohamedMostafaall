function playTone(freq, type, duration) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start();
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
}
function playCorrectSound() { playTone(600,'sine',0.1); setTimeout(()=>playTone(800,'sine',0.15),100); }

// ============================================================
// APP LOGIC
// ============================================================

function handleLogin() {
    const nameInput = document.getElementById('loginStudentName').value.trim();
    if(!nameInput) {
        document.getElementById('loginError').classList.remove('hidden');
        return;
    }
    currentStudentName = nameInput;
    document.getElementById('displayStudentName').innerText = currentStudentName;
    
    // Build Topics Menu
    const container = document.getElementById('topicsContainer');
    container.innerHTML = '';
    topicsList.forEach((topic, idx) => {
        // Different colors for variety
        const colors = ['blue', 'green', 'yellow', 'purple', 'rose', 'orange', 'sky'];
        const c = colors[idx % colors.length];
        const btn = document.createElement('button');
        btn.className = `btn-modern bg-white text-gray-800 font-bold p-4 rounded-2xl shadow-md border-l-8 border-${c}-400 hover:bg-${c}-50 hover:scale-105 transition-all text-left flex justify-between items-center group`;
        btn.innerHTML = `
                <span class="english-text text-lg"></span>
                <span class="text-${c}-300 group-hover:text-${c}-500">▶</span>`;
        btn.querySelector('span').innerText = topic.title;
        btn.addEventListener('click', () => startTopic(topic.key, topic.title));
        container.appendChild(btn);
    });

    hideAllViews();
    document.getElementById('mainMenu').classList.remove('hidden');
}

function showMainMenu() {
    hideAllViews();
    document.getElementById('mainMenu').classList.remove('hidden');
}

function startTopic(topicKey, topicTitle) {
    currentTopicKey = topicKey;
    currentTopicName = topicTitle;
    currentQuestionsList = grammarDb[topicKey];
    currentQuestionIndex = 0; 
    currentGameScore = 0; 
    gameReportData = [];
    
    document.getElementById('gameQuitBtn').onclick = showMainMenu;
    document.getElementById('scoreDisplay').innerText = 0;
    document.getElementById('qTotal').innerText = currentQuestionsList.length; // Should be 25
    document.getElementById('gameTitle').innerText = currentTopicName;
    document.getElementById('progressBar').style.width = '0%';
    
    hideAllViews();
    document.getElementById('gameArea').classList.remove('hidden');
    loadQuestion();
}

function loadQuestion() {
    if(currentQuestionIndex >= currentQuestionsList.length) { endGame(); return; }
    
    const q = currentQuestionsList[currentQuestionIndex];
    document.getElementById('qCurrent').innerText = currentQuestionIndex + 1;
    document.getElementById('progressBar').style.width = ((currentQuestionIndex) / currentQuestionsList.length * 100) + '%';
    
    const container = document.getElementById('dynamicQuestionArea');
    container.innerHTML = '';
    container.style.pointerEvents = 'auto';

    let html = `<h2 class="text-3xl md:text-5xl font-black text-gray-800 mb-10 leading-relaxed tracking-wide english-text">${q.qText}</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-3xl mx-auto" id="optionsArea"></div>`;
    container.innerHTML = html;

    const optArea = document.getElementById('optionsArea');
    q.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        // Colors for options
        const btnColors = ['bg-blue-50 text-blue-900 border-blue-200 hover:bg-blue-100', 
                           'bg-rose-50 text-rose-900 border-rose-200 hover:bg-rose-100', 
                           'bg-amber-50 text-amber-900 border-amber-200 hover:bg-amber-100', 
                           'bg-emerald-50 text-emerald-900 border-emerald-200 hover:bg-emerald-100'];
        
        btn.className = `btn-modern font-bold px-6 py-5 rounded-2xl border-4 transition-all text-xl md:text-2xl english-text shadow-sm ${btnColors[idx % 4]}`;
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(opt === q.ans, btn, opt, q);
        optArea.appendChild(btn);
    });
}

function handleAnswer(isCorrect, element, selectedOptText, qObj) {
    const container = document.getElementById('dynamicQuestionArea');
    container.style.pointerEvents = 'none';
    
    gameReportData.push({ qText: qObj.qText, uAns: selectedOptText, cAns: qObj.ans, isCorrect });
    
    if(isCorrect) {
        currentGameScore++; // 1 point per question
        document.getElementById('scoreDisplay').innerText = currentGameScore;
        playCorrectSound();
        element.classList.add('!bg-green-500','!text-white','!border-green-600','scale-105');
        showFeedback(true, 'Correct!');
    } else {
        playWrongSound();
        element.classList.add('!bg-red-500','!text-white','!border-red-600','shake');
        showFeedback(false, `Oops! Correct answer is:<br><span class="text-green-700 font-black mt-2 inline-block">${qObj.ans}</span>`);
    }
    
    setTimeout(() => { hideFeedback(); currentQuestionIndex++; loadQuestion(); }, 1500);
}

function showFeedback(isCorrect, text) {
    const overlay = document.getElementById('feedbackOverlay');
    const card = document.getElementById('feedbackCard');
    const icon = document.getElementById('feedbackIcon');
    const textEl = document.getElementById('feedbackText');
    
    overlay.classList.remove('hidden'); overlay.classList.add('flex');
    card.classList.remove('scale-0'); card.classList.add('pop-out');
    
    if(isCorrect) {
        icon.innerHTML = '⭐';
        icon.classList.add('animate-bounce'); icon.classList.remove('shake');
        textEl.innerHTML = text;
        textEl.className = 'text-3xl md:text-4xl font-black text-green-600 mt-2 english-text uppercase tracking-widest';
    } else {
        icon.innerHTML = '❌';
        icon.classList.add('shake'); icon.classList.remove('animate-bounce');
        textEl.innerHTML = text;
        textEl.className = 'text-xl md:text-2xl font-bold text-red-600 mt-2 leading-relaxed english-text';
    }
}

function hideFeedback() {
    const overlay = document.getElementById('feedbackOverlay');
    const card = document.getElementById('feedbackCard');
    card.classList.remove('pop-out'); card.classList.add('scale-0');
    setTimeout(() => { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }, 200);
}

function endGame() {
    hideAllViews();
    document.getElementById('resultArea').classList.remove('hidden');
    document.getElementById('finalScore').innerText = currentGameScore;

    const reportContainer = document.getElementById('reportContainer');
    const reportSection = document.getElementById('resultReportSection');
    reportContainer.innerHTML = '';

    if(gameReportData.length > 0) {
        reportSection.classList.remove('hidden');
        gameReportData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `p-4 mb-4 rounded-2xl border-2 text-left ${item.isCorrect?'border-green-300 bg-green-50':'border-red-300 bg-red-50'}`;
            div.innerHTML = `<div class="font-bold text-gray-800 mb-2 text-sm md:text-base english-text">${index+1}. ${item.qText}</div>
                <div class="text-sm space-y-1">
                    <p class="font-bold text-gray-600">Your answer: <span class="${item.isCorrect?'text-green-700':'text-red-700'}">${item.uAns}</span></p>
                    ${!item.isCorrect?`<p class="font-bold text-gray-600">Correct: <span class="text-green-700">${item.cAns}</span></p>`:''}
                </div>`;
            reportContainer.appendChild(div);
        });
    } else { reportSection.classList.add('hidden'); }
    playFinishSound();
}

function sendToWhatsApp() {
    if(!currentStudentName) { alert("Student name is missing!"); return; }
    
    const message = `Hello Mr. Mohamed Mostafa! 👨‍🏫\n\nStudent: *${currentStudentName}* 🌟\nGrammar Topic: *${currentTopicName}* 📚\nScore: *${currentGameScore} / 25* 🏆`;
    window.open(`https://wa.me/201062625048?text=${encodeURIComponent(message)}`, '_blank');
}
